[build]
  # Static-only base avoids installing unrelated root tooling dependencies.
  base = "frontend"
  publish = "."

# Same-origin API for the existing Fleng FastAPI service.
# Resume the Render service before validating login and saved progress.
[[redirects]]
  from = "/api/*"
  to = "https://fleng-fly.onrender.com/api/:splat"
  status = 200
  force = true
