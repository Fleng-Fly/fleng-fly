<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="courses.title">Courses — Fleng</title>
    <script src="/js/i18n-boot.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/courses.css" />
    <meta name="theme-color" content="#0b0917" />
    <script defer src="/js/pwa.js"></script>
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
  </head>
  <body class="dashboard-page courses-page">
    <main class="dashboard-main catalog-main">
      <header class="dashboard-page-heading">
        <div>
          <h1 data-i18n="courses.heading">Courses</h1>
          <p class="dashboard-subtitle" data-i18n="courses.subtitle">Choose a level and start with the first lesson. New to Fleng? Begin with A0.</p>
        </div>
        <a class="catalog-placement-link" href="/placement-test.html" data-i18n="courses.placementLink">Find your level</a>
      </header>
      <section class="catalog-controls" aria-label="Filter courses" data-i18n-attr="aria-label:courses.filterLabel">
        <div class="catalog-search">
          <label class="sr-only" for="course-search" data-i18n="courses.search">Search courses</label>
          <svg aria-hidden="true"><use href="#icon-search" /></svg>
          <input id="course-search" type="search" placeholder="Search courses" data-i18n-attr="placeholder:courses.search" autocomplete="off" />
          <button id="course-search-clear" class="dashboard-text-button" type="button" hidden data-i18n="courses.clear">
            Clear
          </button>
        </div>
        <div id="course-filters" class="catalog-filters" role="group" aria-label="Learning level" data-i18n-attr="aria-label:courses.levelLabel">
          <button type="button" data-level="All" aria-pressed="true" data-i18n="courses.all">All</button>
          <button type="button" data-level="A0" aria-pressed="false">A0</button>
          <button type="button" data-level="A1" aria-pressed="false">A1</button>
          <button type="button" data-level="A2" aria-pressed="false">A2</button>
          <button type="button" data-level="B1" aria-pressed="false">B1</button>
          <button type="button" data-level="B2" aria-pressed="false">B2</button>
        </div>
      </section>
      <p id="course-results-count" class="dashboard-muted" role="status"></p>
      <div id="courses-body" aria-busy="true"></div>
    </main>
    <script type="module" src="/js/courses.js"></script>
  </body>
</html>
