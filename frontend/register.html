<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="register.title">Create account — Fleng</title>
    <script src="/js/i18n-boot.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <meta name="theme-color" content="#0b0917" />
    <script defer src="/js/pwa.js"></script>
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
  </head>
  <body class="sign-up">
    <header id="site-header" class="site-header"></header>

    <main class="container page">
      <div class="auth-wrap">
        <header class="auth-heading">
          <h1 data-i18n="register.heading">Create your account</h1>
          <p class="muted text-sm" data-i18n="register.sub">After signing up you can take a short level test or go straight to the courses.</p>
        </header>

        <div class="card">
          <p id="form-error" class="alert alert-error hidden" role="alert"></p>
          <form id="register-form">
            <label class="field" for="displayName">
              <span data-i18n="field.displayName">Display name</span>
              <input
                id="displayName"
                name="displayName"
                type="text"
                autocomplete="nickname"
                maxlength="80"
                placeholder="Alex"
                required
              />
            </label>

            <label class="field" for="email">
              <span data-i18n="field.email">Email</span>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </label>

            <label class="field" for="password">
              <span data-i18n="field.password">Password</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="At least 8 characters"
                data-i18n-attr="placeholder:field.passwordHint"
                aria-describedby="password-hint"
                required
              />
            </label>

            <p id="password-hint" class="field-hint" data-i18n="field.passwordRule">Use at least 8 characters.</p>

            <button id="submit-button" class="btn btn-primary btn-block" type="submit" data-i18n="auth.register">
              Create account
            </button>
          </form>
        </div>

        <p class="text-sm muted auth-switch">
          <span data-i18n="register.haveAccount">Already have an account?</span> <a href="/login.html" data-i18n="auth.login">Log in</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container" data-i18n="footer.tagline">Fleng — learn English, every day.</div>
    </footer>

    <script type="module" src="/js/register.js"></script>
  </body>
</html>
