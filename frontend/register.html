<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account — Fleng</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <meta name="theme-color" content="#0b0917" />
    <script defer src="/js/pwa.js"></script>
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
    <link rel="stylesheet" href="/css/figma-reference.css" />
</head>
  <body class="sign-up">
    <header id="site-header" class="site-header"></header>

    <div class="auth-stars" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span><span>✦</span></div>
    <main class="container page">
      <div class="auth-wrap">
        <header style="text-align: center; margin-bottom: 1.5rem">
          <h1>Fleng-fly-english</h1>
          <span class="auth-subtitle">Sign up</span>
          <p class="muted text-sm">Create your account and blast off into fluency</p>
        </header>

        <div class="card">
          <p id="form-error" class="alert alert-error hidden" role="alert"></p>
          <form id="register-form">
            <label class="field" for="displayName">
              Display name
              <input
                id="displayName"
                name="displayName"
                type="text"
                autocomplete="nickname"
                maxlength="80"
                placeholder="Alex"
                required
              />
            </label>

            <label class="field" for="email">
              Email
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </label>

            <label class="field" for="password">
              Password
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="At least 8 characters"
                required
              />
              <button class="auth-password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
            </label>

            <button id="submit-button" class="btn btn-primary btn-block" type="submit">
              Create Account →
            </button>
          </form>
        </div>

        <div class="auth-alternatives"><p>Or continue with</p><div class="auth-social-row"><button type="button" disabled aria-label="Google sign-in is not available" title="Google sign-in is not available">Google</button><button type="button" disabled aria-label="Apple sign-in is not available" title="Apple sign-in is not available">Apple</button><button type="button" disabled aria-label="Telegram sign-in is not available" title="Telegram sign-in is not available">Telegram</button></div><small>Social sign-in is not available yet.</small></div>
        <p class="text-sm muted auth-footer" style="text-align: center; margin-top: 1rem">
          Already have an account? <a href="/login.html">Log in</a>.
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">Fleng — learn English, every day.</div>
    </footer>

    <script type="module" src="/js/register.js"></script>
    <script type="module" src="/js/auth-controls.js"></script>
</body>
</html>
