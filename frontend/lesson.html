<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="lesson.title">Lesson — Fleng</title>
    <script src="/js/i18n-boot.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/lesson.css" />
    <meta name="theme-color" content="#0b0917" />
    <script defer src="/js/pwa.js"></script>
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
  </head>
  <body class="dashboard-page lesson-page">
    <main class="dashboard-main">
      <div id="lesson-loading" class="lesson-card lesson-loading" role="status" data-i18n="lesson.loading">Loading your lesson…</div>
      <section id="lesson-error" class="lesson-card lesson-error" role="alert" hidden></section>
      <div id="lesson-content" hidden>
        <nav class="lesson-breadcrumb" aria-label="Breadcrumb" data-i18n-attr="aria-label:catalog.breadcrumb">
          <a href="/courses.html" data-i18n="nav.courses">Courses</a><span aria-hidden="true">/</span>
          <a id="lesson-course-link" href="/courses.html">Course</a>
        </nav>
        <section class="lesson-hero lesson-reveal" aria-labelledby="lesson-title">
          <div class="lesson-hero-copy">
            <div class="lesson-hero-meta"><span id="lesson-number">LESSON</span><span id="lesson-level"></span><span id="lesson-duration"></span></div>
            <h1 id="lesson-title"></h1><p id="lesson-subtitle"></p>
            <div class="lesson-hero-progress"><span id="lesson-activity-count"></span><span id="lesson-xp"></span></div>
            <div id="lesson-progress" class="lesson-track" role="progressbar" aria-label="Completed lesson activities" data-i18n-attr="aria-label:lesson.progressLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="lesson-fill"></span></div>
          </div>
          <span class="lesson-hero-art" aria-hidden="true">✦</span>
        </section>
        <div class="lesson-grid">
          <div class="lesson-primary">
            <div class="lesson-tabs" role="tablist" aria-label="Lesson content" data-i18n-attr="aria-label:lesson.tabsLabel">
              <button id="tab-theory" role="tab" aria-controls="panel-theory" aria-selected="true" type="button" data-i18n="lesson.tabTheory">Theory</button>
              <button id="tab-practice" role="tab" aria-controls="panel-practice" aria-selected="false" tabindex="-1" type="button" data-i18n="lesson.tabPractice">Practice</button>
              <button id="tab-vocabulary" role="tab" aria-controls="panel-vocabulary" aria-selected="false" tabindex="-1" type="button" data-i18n="lesson.tabVocabulary">Vocabulary</button>
            </div>
            <section id="lesson-completed" class="lesson-completed" role="status" hidden></section>
            <div id="lesson-last-answer"></div>
            <section id="panel-theory" role="tabpanel" aria-labelledby="tab-theory" tabindex="0"></section>
            <section id="panel-practice" role="tabpanel" aria-labelledby="tab-practice" tabindex="0" hidden></section>
            <section id="panel-vocabulary" role="tabpanel" aria-labelledby="tab-vocabulary" tabindex="0" hidden></section>
          </div>
          <aside class="lesson-secondary" aria-label="Questions" data-i18n-attr="aria-label:lesson.questions">
            <section class="lesson-card lesson-template lesson-reveal" aria-labelledby="template-heading">
              <div class="lesson-card-heading"><h2 id="template-heading" data-i18n="lesson.questions">Questions</h2></div>
              <p class="lesson-muted" data-i18n="lesson.questionsHint">Open any question. Filled bars mark finished ones.</p>
              <div id="template-preview"></div>
            </section>
          </aside>
        </div>
      </div>
    </main>

    <script type="module" src="/js/lesson.js"></script>
  </body>
</html>
