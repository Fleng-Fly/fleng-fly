<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="cw.pageTitle">Course Words — Fleng</title>
  <script src="/js/i18n-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/lesson.css" />
  <link rel="stylesheet" href="/css/vocabulary.css" />
  <link rel="stylesheet" href="/css/fleng-theme.css" />
  <link rel="stylesheet" href="/css/motion.css" />
  <meta name="theme-color" content="#0b0917" />
  <script defer src="/js/pwa.js"></script>
</head>
<body class="dashboard-page vocabulary-page">
  <main class="dashboard-main">
    <div class="dashboard-page-heading">
      <div><p class="dashboard-eyebrow" data-i18n="cw.eyebrow">LEARN IN CONTEXT</p><h1 data-i18n="ws.courseWords">Course Words</h1><p class="dashboard-subtitle" data-i18n="cw.subtitle">Words from the courses. Save useful ones and practise them in My Words.</p></div>
      <a class="lesson-button lesson-button-secondary" href="/vocabulary.html?mode=flashcards" data-i18n="cw.practiseMine">Practise my words ↗</a>
    </div>
    <div class="word-toolbar course-words-toolbar">
      <label class="field" for="word-course"><span data-i18n="cw.courseLabel">Course</span><select id="word-course"><option value="" data-i18n="cw.allCourses">All courses</option></select></label>
      <label class="word-search"><span class="sr-only" data-i18n="cw.searchLabel">Search course words</span><input id="course-word-search" type="search" placeholder="Find a word or translation…" data-i18n-attr="placeholder:cw.searchPlaceholder" /></label>
    </div>
    <p id="course-words-loading" class="dashboard-muted" role="status" data-i18n="cw.loading">Loading course words…</p>
    <div id="course-words-error" class="dashboard-alert" role="alert" hidden><span id="course-words-error-text"></span> <button id="course-words-retry" class="dashboard-text-button" type="button" data-i18n="common.tryAgain">Try again</button></div>
    <section aria-label="Course vocabulary" data-i18n-attr="aria-label:cw.course">
      <div class="section-heading"><h2 data-i18n="lesson.tabVocabulary">Vocabulary</h2><span id="course-word-count" class="dashboard-muted" role="status"></span></div>
      <div id="course-word-list" class="word-list"></div>
    </section>
    <p id="course-word-feedback" class="word-feedback" role="status"></p>
  </main>
  <script type="module" src="/js/course-words.js"></script>
</body>
</html>
