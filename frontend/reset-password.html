<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset password — Fleng</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
    <script defer src="/js/pwa.js"></script>
  </head>
  <body class="log-in">
    <main class="container page">
      <div class="auth-wrap">
        <h1>Reset your password</h1>
        <p id="reset-status" role="status" aria-live="polite"></p>
        <form id="reset-password-form" hidden>
          <label class="field" for="new-password">New password
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          </label>
          <label class="field" for="confirm-password">Confirm password
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          </label>
          <button id="reset-submit" class="btn btn-primary btn-block" type="submit">Update password</button>
        </form>
        <p><a href="/login.html">Log in or request a new reset link</a></p>
      </div>
    </main>
    <script type="module" src="/js/reset-password.js"></script>
  </body>
</html>
