<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard — Fleng</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/leaderboard.css" />
    <meta name="theme-color" content="#0b0917" />
    <script defer src="/js/pwa.js"></script>
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
    <link rel="stylesheet" href="/css/figma-reference.css" />
</head>
  <body class="dashboard-page leaderboard-page">
    <main class="dashboard-main">
      <div class="dashboard-page-heading">
        <div>
          <p class="dashboard-eyebrow">LEADERBOARD</p>
          <h1>Top <span>Learners</span></h1>
          <p class="dashboard-subtitle">
            The most active and consistent learners in FLENG.
          </p>
        </div>
        <span class="dashboard-level">All-time ranking</span>
      </div>
      <div id="leaderboard-body" aria-live="polite" aria-busy="true">
        <div class="dashboard-card leaderboard-message" role="status">Loading learners…</div>
      </div>
    </main>
    <script type="module" src="/js/leaderboard.js"></script>
  </body>
</html>
