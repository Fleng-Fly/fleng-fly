<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Fleng</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <main class="container page">
      <div class="stack">
        <header>
          <h1>Dashboard</h1>
          <p class="muted text-sm">Your profile and progress in one place.</p>
        </header>

        <section class="card">
          <div class="row">
            <div>
              <p class="muted text-sm" style="margin: 0">Signed in as</p>
              <p id="user-name" style="margin: 0.15rem 0 0; font-size: 1.15rem; font-weight: 600">
                —
              </p>
              <p id="user-email" class="muted text-sm" style="margin: 0.15rem 0 0">—</p>
            </div>
            <div class="stat-grid" style="min-width: 14rem">
              <div class="stat">
                <div class="stat-label">Level</div>
                <div id="user-level" class="stat-value">—</div>
              </div>
              <div class="stat">
                <div class="stat-label">XP</div>
                <div id="user-xp" class="stat-value">—</div>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2 class="section-title">Progress</h2>
          <div id="progress-body"></div>
        </section>

        <section class="card">
          <div class="row">
            <div>
              <h2 class="section-title" style="margin: 0">Courses</h2>
              <p class="text-sm muted" style="margin: 0.25rem 0 0">
                Browse the catalog and open your first lesson.
              </p>
            </div>
            <a class="btn btn-primary" href="/courses.html">Browse courses</a>
          </div>
        </section>

        <div class="actions">
          <a class="btn btn-ghost" href="/courses.html">Courses</a>
          <a class="btn btn-ghost" href="/settings.html">Settings</a>
          <a class="btn btn-ghost" href="/index.html">Back home</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">Fleng — learn English, every day.</div>
    </footer>

    <script type="module" src="/js/dashboard.js"></script>
  </body>
</html>
