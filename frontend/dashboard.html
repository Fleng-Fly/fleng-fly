<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="dashboard.title">Dashboard — Fleng</title>
    <script src="/js/i18n-boot.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <meta name="theme-color" content="#0b0917" />
    <script defer src="/js/pwa.js"></script>
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
  </head>
  <body class="dashboard-page">
    <main class="dashboard-main">
      <section id="session-error" class="dashboard-alert" role="alert" hidden>
        <span id="session-error-text"></span>
        <button id="session-retry" class="dashboard-text-button" type="button" data-i18n="common.tryAgain">
          Try again
        </button>
      </section>

      <div id="dashboard-content" hidden>
        <div class="dashboard-page-heading">
          <div>
            <p class="dashboard-eyebrow" data-i18n="dashboard.eyebrow">YOUR LEARNING</p>
            <h1 id="welcome-title" data-i18n="dashboard.heading">Dashboard</h1>
            <p id="welcome-message" class="dashboard-subtitle" data-i18n="dashboard.subtitle">
              Pick up where you left off.
            </p>
          </div>
          <span id="dashboard-level" class="dashboard-level" hidden></span>
        </div>
        <div class="dashboard-grid">
          <div class="dashboard-primary">
            <section class="dashboard-section dashboard-reveal" aria-labelledby="current-course-heading">
              <div class="section-heading">
                <div>
                  <p class="dashboard-eyebrow" data-i18n="dashboard.keepGoing">CONTINUE LEARNING</p>
                  <h2 id="current-course-heading" data-i18n="dashboard.currentCourse">Current course</h2>
                </div>
              </div>
              <div id="current-course-body" class="dashboard-card current-course-card" aria-live="polite">
                <p class="dashboard-muted" data-i18n="common.loading">Loading…</p>
              </div>
            </section>
            <section
              id="placement-guidance"
              class="dashboard-card placement-guidance dashboard-reveal"
              aria-label="Your next step"
              data-i18n-attr="aria-label:dashboard.nextStep"
              aria-live="polite"
            ></section>
          </div>
          <aside id="your-progress" class="dashboard-secondary dashboard-reveal" aria-labelledby="progress-heading">
            <div class="dashboard-card progress-panel">
              <div class="section-heading">
                <div>
                  <p class="dashboard-eyebrow" data-i18n="dashboard.atAGlance">AT A GLANCE</p>
                  <h2 id="progress-heading" data-i18n="dashboard.progress">Your progress</h2>
                </div>
                <a class="dashboard-text-button" href="/progress.html" data-i18n="dashboard.details">Details</a>
              </div>
              <div id="progress-body" aria-live="polite">
                <p class="dashboard-muted" data-i18n="common.loading">Loading…</p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <script type="module" src="/js/dashboard.js"></script>
  </body>
</html>
