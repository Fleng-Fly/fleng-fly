<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="login.title">Log in — Fleng</title>
    <script src="/js/i18n-boot.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/star4life.css" />
    <meta name="theme-color" content="#0b0917" />
    <script defer src="/js/pwa.js"></script>
    <link rel="stylesheet" href="/css/fleng-theme.css" />
    <link rel="stylesheet" href="/css/motion.css" />
  </head>
  <body class="log-in">
    <header id="site-header" class="site-header"></header>

    <main class="container page">
      <div class="auth-wrap">
        <header class="auth-heading">
          <h1 data-i18n="login.heading">Welcome back</h1>
          <p class="muted text-sm" data-i18n="login.sub">Log in to continue your learning.</p>
        </header>

        <div class="card">
          <p id="form-error" class="alert alert-error hidden" role="alert"></p>
          <form id="login-form">
            <label class="field" for="email">
              <span data-i18n="field.email">Email</span>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </label>

            <label class="field" for="password">
              <span data-i18n="field.password">Password</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
            </label>

            <button id="submit-button" class="btn btn-primary btn-block" type="submit" data-i18n="auth.login">
              Log in
            </button>
          </form>
          <div id="google-block" class="hidden">
            <p class="oauth-divider" aria-hidden="true"><span data-i18n="auth.or">or</span></p>
            <a id="google-button" class="btn btn-secondary btn-block btn-google" href="/api/v1/auth/google/start?page=login">
              <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
              <span data-i18n="auth.google">Continue with Google</span>
            </a>
          </div>
          <details>
            <summary data-i18n="login.forgot">Forgot your password?</summary>
            <form id="reset-request-form">
              <label class="field" for="reset-email"><span data-i18n="login.resetEmail">Account email</span>
                <input id="reset-email" name="email" type="email" autocomplete="email" required />
              </label>
              <button id="reset-request-button" class="btn btn-secondary btn-block" type="submit" data-i18n="login.sendReset">Send reset link</button>
              <p id="reset-request-status" role="status" aria-live="polite"></p>
            </form>
          </details>
        </div>

        <p class="text-sm muted auth-switch">
          <span data-i18n="login.noAccount">No account yet?</span> <a href="/register.html" data-i18n="login.createOne">Create one</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container" data-i18n="footer.tagline">Fleng — learn English, every day.</div>
    </footer>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
