# /etc/nginx/sites-available/fleng  (replace __HOSTNAME__, e.g. 203-0-113-7.sslip.io)
# Start with this HTTP-only block; `certbot --nginx` adds the TLS server and redirect.
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name __HOSTNAME__;

    # Application limit is 128 KiB (HTTP_MAX_BODY_BYTES); keep nginx slightly above it.
    client_max_body_size 256k;

    # AI answers are Server-Sent Events: no buffering, long read timeout.
    location /api/v1/ai/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: clients must not inject forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
